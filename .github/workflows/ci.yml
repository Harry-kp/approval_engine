name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop
      - name: Build gem (packaging smoke test)
        run: gem build approval_engine.gemspec

  test:
    runs-on: ubuntu-latest
    name: test (ruby ${{ matrix.ruby }}, rails ${{ matrix.rails || 'latest' }})
    strategy:
      fail-fast: false
      # The gemspec supports Rails >= 7.1, < 9.0. Pin one Rails per entry so
      # that range is exercised rather than asserted; a bare RAILS_VERSION
      # resolves to the newest release.
      matrix:
        include:
          - { ruby: "3.2", rails: "7.1" }
          - { ruby: "3.3", rails: "7.2" }
          - { ruby: "3.4", rails: "8.0" }
          - { ruby: "3.4", rails: "" }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Prepare database
        # Migrate rather than load schema.rb, which carries the Rails version
        # that dumped it and so cannot be read by an older Rails in this matrix.
        # The engine's and the dummy's migrations interleave by timestamp and
        # run from separate paths, hence the second engine pass.
        env:
          RAILS_ENV: test
        run: |
          bin/rails app:db:create
          bin/rails app:db:migrate
          (cd test/dummy && bin/rails db:migrate)
          bin/rails app:db:migrate
      - name: Run tests
        run: bin/rails app:test
